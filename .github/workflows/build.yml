# Kompilierprüfung auf allen Zielplattformen (D10). Ohne Spieldaten: Tabellen sind Platzhalter (NFSU_STUB_TABLES),
# die Programme bauen, verhalten sich aber nicht wie das Original. Tests mit Spieldaten laufen nur lokal.
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install ninja
      - name: Abhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev
      - name: Abhängigkeiten (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $root = (Get-ChildItem ffmpeg -Directory)[0].FullName -replace '\\','/'
          "FFMPEG_ROOT=$root" >> $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Konfigurieren
        working-directory: port
        shell: bash
        run: cmake --preset ci ${FFMPEG_ROOT:+-DFFMPEG_ROOT=$FFMPEG_ROOT}
      - name: Bauen
        working-directory: port
        run: cmake --build --preset ci
